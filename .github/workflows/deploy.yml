name: Deploy & Previews

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write        # push the built site to the gh-pages branch
  pull-requests: write   # post the preview link on the PR

# Serialise writes to the gh-pages branch so concurrent runs never clobber
# each other (production, dev, PR previews, and the dashboard share that branch).
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build (skipped when a PR is merely being closed — nothing to rebuild)
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npm run build

      # PR preview → /pr-preview/pr-<N>/  (auto-deploys, comments the link,
      # and removes the folder again when the PR is closed/merged)
      - name: PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist

      # Production: push to main → site root
      - name: Deploy production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true   # preserve /preview, /pr-preview, /deployments

      # Dev preview: push to dev → /preview/dev/
      - name: Deploy dev preview (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/dev
          keep_files: true

  # ── Live deployments dashboard → /deployments/ ────────────────────────────
  # Regenerated after every deploy: lists production, the dev sandbox, and a
  # live row for each open pull request's preview.
  dashboard:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate dashboard
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const base = `https://${owner}.github.io/${repo}`;
            const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const now = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const prRows = prs.length ? prs.map(pr => `
              <tr>
                <td><a href="${base}/pr-preview/pr-${pr.number}/">▶ Preview PR #${pr.number}</a></td>
                <td>${esc(pr.title)}</td>
                <td><code>${esc(pr.head.ref)}</code></td>
                <td>@${esc(pr.user.login)}</td>
                <td><a href="${pr.html_url}">discussion ↗</a></td>
              </tr>`).join('') : `<tr><td colspan="5" class="empty">No open pull requests right now.</td></tr>`;
            const html = `<!doctype html><html lang="en"><head><meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Deployments · ${esc(repo)}</title>
            <style>
              :root{color-scheme:dark}
              body{margin:0;background:#101828;color:#EDE6D6;font-family:system-ui,-apple-system,'DM Sans',sans-serif;line-height:1.6}
              .wrap{max-width:900px;margin:0 auto;padding:2rem 1.25rem 4rem}
              h1{font-size:1.6rem;margin:0 0 .25rem}
              .sub{color:#C8DDB8;font-size:.85rem;margin:0 0 2rem}
              h2{font-size:1.05rem;margin:2rem 0 .75rem;color:#87A96B}
              .card{display:block;background:#132234;border:1px solid rgba(255,255,255,.08);border-left:3px solid #5D8F2E;border-radius:12px;padding:1rem 1.1rem;margin-bottom:.6rem;text-decoration:none;color:inherit}
              .card small{color:#C8DDB8;font-family:ui-monospace,monospace}
              .card .u{color:#87A96B;font-family:ui-monospace,monospace;font-size:.8rem;word-break:break-all}
              table{width:100%;border-collapse:collapse;font-size:.9rem}
              th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
              th{color:#C8DDB8;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
              a{color:#7AB8D4}
              code{background:#1A2E44;padding:1px 6px;border-radius:5px;font-size:.82em}
              .empty{color:#C8DDB8;text-align:center;padding:1.25rem}
              .foot{margin-top:2.5rem;color:#6b7d8f;font-size:.75rem;font-family:ui-monospace,monospace}
              .tablewrap{overflow-x:auto}
            </style></head><body><div class="wrap">
              <h1>Deployments · ${esc(repo)}</h1>
              <p class="sub">Every live version of this site. Updated on each deploy.</p>
              <h2>Production &amp; sandbox</h2>
              <a class="card" href="${base}/"><strong>Production</strong> — the <code>main</code> branch<br><span class="u">${base}/</span></a>
              <a class="card" href="${base}/preview/dev/" style="border-left-color:#D4A574"><strong>Dev sandbox</strong> — the <code>dev</code> branch<br><span class="u">${base}/preview/dev/</span></a>
              <h2>Open pull requests (${prs.length})</h2>
              <div class="tablewrap"><table>
                <tr><th>Preview</th><th>Title</th><th>Branch</th><th>By</th><th>PR</th></tr>
                ${prRows}
              </table></div>
              <p class="foot">Generated ${now} · commit ${context.sha.slice(0,7)}</p>
            </div></body></html>`;
            fs.mkdirSync('dashboard', { recursive: true });
            fs.writeFileSync('dashboard/index.html', html);
      - name: Publish dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          destination_dir: deployments
          keep_files: true
